<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Ночная история для Зайчули-красотули. Маленький мир, созданный с теплом.">
<meta property="og:title" content="Для Зайчули-красотули 🌙">
<meta property="og:description" content="Оставим всё плохое за этой дверью и попробуем вернуть улыбку и настроение.">
<meta property="og:type" content="website">

<title>Для Зайчули-красотули 🌙</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Marck+Script&display=swap" rel="stylesheet">

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,
body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:#03040b;
}

body{
    font-family:"Cormorant Garamond",serif;
    color:#f8edf5;
}

/* =========================
   SCENE
========================= */

.scene{
    position:relative;
    width:100%;
    height:100%;
    overflow:hidden;
    isolation:isolate;
    background:
        radial-gradient(circle at 50% 25%,rgba(91,64,120,.22),transparent 28%),
        radial-gradient(circle at 80% 70%,rgba(77,38,91,.15),transparent 32%),
        linear-gradient(180deg,#050713 0%,#080916 42%,#0a0711 72%,#03040a 100%);
}

/* distant galaxy */

.galaxy{
    position:absolute;
    inset:-20%;
    z-index:0;
    background:
        radial-gradient(ellipse at 47% 35%,rgba(125,89,155,.13),transparent 19%),
        radial-gradient(ellipse at 72% 25%,rgba(73,93,156,.09),transparent 20%),
        radial-gradient(ellipse at 20% 65%,rgba(105,49,101,.10),transparent 22%);
    filter:blur(16px);
    animation:galaxyMove 22s ease-in-out infinite alternate;
}

@keyframes galaxyMove{
    from{transform:scale(1) translate3d(-1%,0,0)}
    to{transform:scale(1.08) translate3d(2%,-1%,0)}
}

/* =========================
   MOON
========================= */

.moon{
    position:absolute;
    z-index:2;
    width:clamp(170px,23vw,310px);
    height:clamp(170px,23vw,310px);
    border-radius:50%;
    top:9%;
    left:50%;
    transform:translateX(-50%);
    background:
        radial-gradient(circle at 32% 28%,#fffdfd 0 7%,transparent 8%),
        radial-gradient(circle at 67% 22%,rgba(150,141,161,.28) 0 5%,transparent 6%),
        radial-gradient(circle at 38% 67%,rgba(126,117,135,.25) 0 7%,transparent 8%),
        radial-gradient(circle at 70% 66%,rgba(112,104,126,.20) 0 9%,transparent 10%),
        radial-gradient(circle at 50% 45%,#eee8ed 0%,#d6ced9 52%,#aaa1b1 100%);
    box-shadow:
        0 0 25px rgba(242,228,246,.48),
        0 0 70px rgba(220,191,233,.25),
        0 0 145px rgba(171,122,201,.16);
    animation:moonFloat 9s ease-in-out infinite;
}

@keyframes moonFloat{
    0%,100%{transform:translateX(-50%) translateY(0)}
    50%{transform:translateX(-50%) translateY(-8px)}
}

.moon::before{
    content:"";
    position:absolute;
    inset:-20px;
    border-radius:50%;
    background:radial-gradient(circle,rgba(236,216,244,.14),transparent 67%);
    filter:blur(7px);
}

/* =========================
   STARS
========================= */

.stars{
    position:absolute;
    inset:0;
    z-index:1;
    overflow:hidden;
}

.star{
    position:absolute;
    width:2px;
    height:2px;
    border-radius:50%;
    background:#fff;
    box-shadow:0 0 6px rgba(255,255,255,.8);
    opacity:.45;
    animation:twinkle var(--duration) ease-in-out infinite;
}

.star.large{
    width:3px;
    height:3px;
}

@keyframes twinkle{
    0%,100%{opacity:.18;transform:scale(.75)}
    50%{opacity:.95;transform:scale(1.45)}
}

/* star dust */

.dust{
    position:absolute;
    inset:0;
    z-index:1;
    opacity:.55;
    background:
        radial-gradient(circle at 12% 24%,rgba(255,255,255,.55) 0 1px,transparent 2px),
        radial-gradient(circle at 19% 37%,rgba(220,194,255,.5) 0 1px,transparent 2px),
        radial-gradient(circle at 28% 17%,rgba(255,255,255,.42) 0 1px,transparent 2px),
        radial-gradient(circle at 37% 31%,rgba(220,200,255,.35) 0 1px,transparent 2px),
        radial-gradient(circle at 57% 18%,rgba(255,255,255,.5) 0 1px,transparent 2px),
        radial-gradient(circle at 64% 36%,rgba(230,204,255,.4) 0 1px,transparent 2px),
        radial-gradient(circle at 77% 17%,rgba(255,255,255,.42) 0 1px,transparent 2px),
        radial-gradient(circle at 89% 31%,rgba(218,198,255,.4) 0 1px,transparent 2px),
        radial-gradient(circle at 83% 52%,rgba(255,255,255,.38) 0 1px,transparent 2px);
    animation:dustDrift 28s ease-in-out infinite alternate;
}

@keyframes dustDrift{
    from{transform:translate3d(-1%,0,0) scale(1)}
    to{transform:translate3d(1%,1%,0) scale(1.03)}
}

/* =========================
   SHOOTING STARS
========================= */

.shooting-star{
    position:absolute;
    z-index:3;
    width:110px;
    height:1px;
    opacity:0;
    background:linear-gradient(90deg,transparent,rgba(255,239,255,.9));
    transform:rotate(-25deg);
    filter:drop-shadow(0 0 5px rgba(255,225,255,.8));
    pointer-events:none;
}

.shooting-star.active{
    animation:shoot 1.7s ease-out forwards;
}

@keyframes shoot{
    0%{
        opacity:0;
        transform:translate3d(0,0,0) rotate(-25deg);
    }
    12%{opacity:1}
    100%{
        opacity:0;
        transform:translate3d(-360px,180px,0) rotate(-25deg);
    }
}

/* =========================
   SAKURA FOREST
========================= */

.forest{
    position:absolute;
    left:0;
    right:0;
    bottom:0;
    height:63%;
    z-index:4;
    pointer-events:none;
}

/* dark distant silhouettes */

.distant-tree{
    position:absolute;
    bottom:8%;
    width:230px;
    height:360px;
    opacity:.42;
    filter:blur(1px);
}

.distant-tree .trunk{
    position:absolute;
    left:50%;
    bottom:0;
    width:30px;
    height:250px;
    transform:translateX(-50%) rotate(4deg);
    background:linear-gradient(90deg,#09070c,#211523 45%,#08060a);
    border-radius:50%;
}

.distant-tree .crown{
    position:absolute;
    width:280px;
    height:220px;
    left:50%;
    top:0;
    transform:translateX(-50%);
    border-radius:48% 52% 45% 55%;
    background:
        radial-gradient(circle at 25% 45%,rgba(53,29,55,.9),transparent 29%),
        radial-gradient(circle at 55% 30%,rgba(61,35,65,.85),transparent 30%),
        radial-gradient(circle at 78% 53%,rgba(47,28,51,.9),transparent 31%),
        #0d0a12;
}

/* foreground sakura tree */

.sakura-tree{
    position:absolute;
    bottom:-4%;
    width:430px;
    height:610px;
    filter:drop-shadow(0 10px 24px rgba(0,0,0,.42));
}

.tree-left{
    left:-110px;
}

.tree-right{
    right:-110px;
    transform:scaleX(-1);
}

.tree-center{
    left:50%;
    bottom:-18%;
    transform:translateX(-50%) scale(.76);
    opacity:.72;
}

/* trunk */

.sakura-tree .trunk{
    position:absolute;
    bottom:0;
    left:50%;
    width:64px;
    height:470px;
    transform:translateX(-50%) rotate(-4deg);
    border-radius:60% 40% 30% 25%;
    background:
        linear-gradient(90deg,
            #09070b 0%,
            #1b1119 22%,
            #30202b 43%,
            #140c15 70%,
            #07060a 100%);
    box-shadow:
        inset 10px 0 15px rgba(0,0,0,.45),
        inset -8px 0 10px rgba(117,73,111,.13);
}

.sakura-tree .trunk::after{
    content:"";
    position:absolute;
    left:43%;
    top:-10px;
    width:16px;
    height:430px;
    border-radius:50%;
    background:linear-gradient(90deg,transparent,rgba(118,76,107,.18),transparent);
    transform:rotate(8deg);
}

/* branches */

.branch{
    position:absolute;
    height:24px;
    border-radius:100% 20% 20% 100%;
    transform-origin:left center;
    background:linear-gradient(90deg,#100a11,#30202c 60%,#120b12);
}

.branch.one{
    width:250px;
    left:49%;
    top:28%;
    transform:rotate(-30deg);
}

.branch.two{
    width:215px;
    left:46%;
    top:39%;
    transform:rotate(31deg);
}

.branch.three{
    width:190px;
    left:39%;
    top:20%;
    transform:rotate(22deg);
}

.branch.four{
    width:160px;
    left:52%;
    top:48%;
    transform:rotate(-20deg);
}

.branch.five{
    width:135px;
    left:35%;
    top:52%;
    transform:rotate(35deg);
}

/* smaller branch endings */

.branch::after{
    content:"";
    position:absolute;
    right:0;
    top:-4px;
    width:70px;
    height:10px;
    border-radius:50%;
    background:#211521;
    transform:rotate(-16deg);
}

/* blossoms */

.blossoms{
    position:absolute;
    inset:0;
}

.blossom{
    position:absolute;
    width:78px;
    height:64px;
    filter:drop-shadow(0 0 8px rgba(230,130,190,.12));
}

.blossom span{
    position:absolute;
    width:25px;
    height:33px;
    border-radius:70% 30% 70% 30%;
    transform-origin:bottom center;
    background:
        radial-gradient(circle at 35% 28%,rgba(255,241,249,.75) 0 7%,transparent 8%),
        linear-gradient(145deg,#e9a7c7,#a85d8b);
    box-shadow:
        inset 2px 2px 4px rgba(255,255,255,.18),
        0 0 8px rgba(219,116,172,.15);
}

.blossom span:nth-child(1){left:27px;top:0;transform:rotate(0deg)}
.blossom span:nth-child(2){left:45px;top:12px;transform:rotate(72deg)}
.blossom span:nth-child(3){left:39px;top:33px;transform:rotate(144deg)}
.blossom span:nth-child(4){left:13px;top:33px;transform:rotate(216deg)}
.blossom span:nth-child(5){left:6px;top:12px;transform:rotate(288deg)}

.blossom::after{
    content:"";
    position:absolute;
    width:10px;
    height:10px;
    left:34px;
    top:27px;
    border-radius:50%;
    background:#f4c5d7;
    box-shadow:0 0 6px rgba(255,215,235,.45);
}

/* blossom positions */

.b1{left:6%;top:7%;transform:scale(1.15)}
.b2{left:22%;top:18%;transform:scale(.82)}
.b3{left:36%;top:4%;transform:scale(1.1)}
.b4{left:52%;top:17%;transform:scale(.72)}
.b5{left:67%;top:5%;transform:scale(1.25)}
.b6{left:82%;top:21%;transform:scale(.92)}
.b7{left:12%;top:39%;transform:scale(.76)}
.b8{left:29%;top:35%;transform:scale(1.08)}
.b9{left:45%;top:41%;transform:scale(.78)}
.b10{left:59%;top:34%;transform:scale(1)}
.b11{left:75%;top:40%;transform:scale(.72)}
.b12{left:88%;top:33%;transform:scale(1.05)}
.b13{left:4%;top:56%;transform:scale(.72)}
.b14{left:18%;top:51%;transform:scale(.92)}
.b15{left:78%;top:56%;transform:scale(.95)}
.b16{left:91%;top:51%;transform:scale(.68)}

/* =========================
   GROUND
========================= */

.ground{
    position:absolute;
    z-index:7;
    left:-5%;
    right:-5%;
    bottom:-11%;
    height:38%;
    border-radius:50% 50% 0 0;
    background:
        radial-gradient(ellipse at 50% 10%,rgba(81,48,79,.26),transparent 48%),
        linear-gradient(180deg,#0c0710,#040509 70%);
    box-shadow:0 -25px 60px rgba(4,3,8,.75);
}

/* =========================
   FALLING SAKURA PETALS
========================= */

.petals{
    position:absolute;
    inset:0;
    z-index:9;
    pointer-events:none;
    overflow:hidden;
}

.petal{
    position:absolute;
    width:13px;
    height:8px;
    border-radius:85% 15% 85% 15%;
    background:linear-gradient(135deg,#ffd4e8,#d878aa 72%);
    box-shadow:
        0 0 5px rgba(255,174,213,.28),
        inset 1px 1px 2px rgba(255,255,255,.3);
    opacity:0;
    will-change:transform,opacity;
    animation:petalFall var(--fall) linear forwards;
}

.petal::after{
    content:"";
    position:absolute;
    width:1px;
    height:7px;
    left:6px;
    top:1px;
    background:rgba(133,55,92,.22);
    transform:rotate(20deg);
}

@keyframes petalFall{
    0%{
        opacity:0;
        transform:translate3d(0,-30px,0) rotate(0deg);
    }
    8%{
        opacity:var(--opacity);
    }
    55%{
        opacity:var(--opacity);
    }
    88%{
        opacity:calc(var(--opacity) * .58);
    }
    100%{
        opacity:0;
        transform:
            translate3d(var(--drift),110vh,0)
            rotate(var(--rotation));
    }
}

/* =========================
   FOG
========================= */

.fog{
    position:absolute;
    z-index:10;
    left:-15%;
    width:130%;
    height:30%;
    bottom:10%;
    opacity:.17;
    filter:blur(20px);
    background:
        radial-gradient(ellipse at 20% 50%,rgba(190,155,196,.38),transparent 42%),
        radial-gradient(ellipse at 60% 40%,rgba(133,157,191,.24),transparent 44%),
        radial-gradient(ellipse at 85% 60%,rgba(192,142,183,.26),transparent 39%);
    animation:fogMove 18s ease-in-out infinite alternate;
    pointer-events:none;
}

.fog.f2{
    bottom:27%;
    opacity:.09;
    filter:blur(30px);
    transform:scaleX(-1);
    animation-duration:25s;
}

.fog.f3{
    bottom:2%;
    opacity:.12;
    filter:blur(36px);
    animation-duration:32s;
}

@keyframes fogMove{
    from{transform:translate3d(-4%,0,0) scaleX(1)}
    to{transform:translate3d(6%,-10px,0) scaleX(1.08)}
}

/* =========================
   WELCOME
========================= */

.welcome{
    position:absolute;
    z-index:20;
    top:50%;
    left:50%;
    width:min(760px,88vw);
    transform:translate(-50%,-50%);
    text-align:center;
    padding:40px 35px;
}

.welcome::before{
    content:"";
    position:absolute;
    inset:-70px;
    z-index:-1;
    border-radius:50%;
    background:radial-gradient(ellipse,rgba(17,11,26,.62),transparent 70%);
    filter:blur(20px);
}

.greeting{
    font-family:"Marck Script",cursive;
    font-size:clamp(34px,5vw,62px);
    line-height:1.08;
    color:#fff1fa;
    text-shadow:
        0 0 15px rgba(242,175,217,.32),
        0 3px 25px rgba(0,0,0,.65);
    margin-bottom:18px;
}

.question{
    font-size:clamp(22px,3vw,35px);
    line-height:1.2;
    color:#eaddea;
    text-shadow:0 2px 15px rgba(0,0,0,.7);
    margin-bottom:25px;
}

.message{
    max-width:650px;
    margin:0 auto 34px;
    font-size:clamp(18px,2.2vw,24px);
    line-height:1.45;
    color:#d8cbd9;
    text-shadow:0 2px 12px rgba(0,0,0,.8);
}

.enter-button{
    position:relative;
    display:inline-flex;
    align-items:center;
    justify-content:center;
    min-width:245px;
    min-height:68px;
    padding:16px 45px;
    border:1px solid rgba(255,195,227,.34);
    border-radius:50px;
    background:
        linear-gradient(180deg,rgba(94,48,86,.56),rgba(40,20,42,.76));
    color:#fff3fa;
    font-family:"Cormorant Garamond",serif;
    font-size:clamp(22px,3vw,30px);
    cursor:pointer;
    box-shadow:
        0 0 25px rgba(208,108,169,.16),
        inset 0 0 20px rgba(255,255,255,.035);
    transition:
        transform .35s ease,
        box-shadow .35s ease,
        background .35s ease;
    -webkit-tap-highlight-color:transparent;
}

.enter-button::before,
.enter-button::after{
    content:"♡";
    position:absolute;
    top:50%;
    transform:translateY(-50%);
    font-size:29px;
    color:#efacd0;
    text-shadow:
        0 0 8px rgba(244,150,204,.7),
        0 0 18px rgba(231,105,176,.3);
}

.enter-button::before{left:-42px}
.enter-button::after{right:-42px}

.enter-button:hover{
    transform:translateY(-3px) scale(1.025);
    box-shadow:
        0 0 35px rgba(225,116,181,.26),
        inset 0 0 25px rgba(255,255,255,.05);
}

.enter-button:active{
    transform:scale(.98);
}

/* =========================
   INTERACTIVE PETALS
========================= */

.tap-petal{
    position:absolute;
    width:14px;
    height:9px;
    border-radius:85% 15% 85% 15%;
    background:linear-gradient(135deg,#ffe0ee,#d776a8);
    box-shadow:
        0 0 7px rgba(255,177,215,.32),
        inset 1px 1px 2px rgba(255,255,255,.32);
    pointer-events:none;
    will-change:transform,opacity;
    animation:tapPetal var(--duration) cubic-bezier(.18,.72,.25,1) forwards;
}

.tap-petal::after{
    content:"";
    position:absolute;
    left:6px;
    top:1px;
    width:1px;
    height:7px;
    background:rgba(119,48,83,.25);
    transform:rotate(20deg);
}

@keyframes tapPetal{
    0%{
        opacity:0;
        transform:
            translate3d(0,0,0)
            rotate(0deg)
            scale(.65);
    }
    10%{
        opacity:.9;
        transform:
            translate3d(calc(var(--x) * .12),calc(var(--y) * .12),0)
            rotate(calc(var(--r) * .12))
            scale(1);
    }
    38%{
        opacity:.82;
    }
    70%{
        opacity:.48;
    }
    100%{
        opacity:0;
        transform:
            translate3d(var(--x),calc(var(--y) + 90px),0)
            rotate(var(--r))
            scale(.82);
    }
}

/* =========================
   FADE
========================= */

.fade{
    position:absolute;
    inset:0;
    z-index:100;
    background:#020308;
    opacity:0;
    pointer-events:none;
    transition:opacity 1.5s ease;
}

.fade.active{
    opacity:1;
}

/* =========================
   MOBILE
========================= */

@media(max-width:700px){

    .moon{
        top:8%;
        width:155px;
        height:155px;
    }

    .forest{
        height:55%;
    }

    .sakura-tree{
        width:300px;
        height:430px;
    }

    .tree-left{
        left:-150px;
    }

    .tree-right{
        right:-150px;
    }

    .tree-center{
        bottom:-10%;
        transform:translateX(-50%) scale(.58);
    }

    .sakura-tree .trunk{
        height:330px;
        width:46px;
    }

    .branch.one{width:180px}
    .branch.two{width:155px}
    .branch.three{width:135px}
    .branch.four{width:125px}
    .branch.five{width:105px}

    .blossom{
        transform:scale(.72);
    }

    .welcome{
        width:91vw;
        padding:25px 18px;
    }

    .greeting{
        font-size:38px;
    }

    .question{
        font-size:25px;
    }

    .message{
        font-size:19px;
    }

    .enter-button{
        min-width:205px;
        min-height:61px;
        padding:13px 35px;
    }

    .enter-button::before{
        left:-30px;
    }

    .enter-button::after{
        right:-30px;
    }
}
</style>
</head>

<body>

<div class="scene">

    <div class="galaxy"></div>

    <div class="moon"></div>

    <div class="dust"></div>

    <div class="stars" id="stars"></div>

    <div class="shooting-star" id="shootingStar"></div>

    <div class="forest">

        <div class="distant-tree" style="left:3%;">
            <div class="trunk"></div>
            <div class="crown"></div>
        </div>

        <div class="distant-tree" style="left:28%;transform:scale(.82);">
            <div class="trunk"></div>
            <div class="crown"></div>
        </div>

        <div class="distant-tree" style="right:25%;transform:scale(.88);">
            <div class="trunk"></div>
            <div class="crown"></div>
        </div>

        <div class="distant-tree" style="right:2%;transform:scale(.75);">
            <div class="trunk"></div>
            <div class="crown"></div>
        </div>

        <div class="sakura-tree tree-left">

            <div class="trunk"></div>

            <div class="branch one"></div>
            <div class="branch two"></div>
            <div class="branch three"></div>
            <div class="branch four"></div>
            <div class="branch five"></div>

            <div class="blossoms">

                <div class="blossom b1">
                    <span></span><span></span><span></span><span></span><span></span>
                </div>

                <div class="blossom b2">
                    <span></span><span></span><span></span><span></span><span></span>
                </div>

                <div class="blossom b3">
                    <span></span><span></span><span></span><span></span><span></span>
                </div>

                <div class="blossom b4">
                    <span></span><span></span><span></span><span></span><span></span>
                </div>

                <div class="blossom b5">
                    <span></span><span></span><span></span><span></span><span></span>
                </div>

                <div class="blossom b6">
                    <span></span><span></span><span></span><span></span><span></span>
                </div>

                <div class="blossom b7">
                    <span></span><span></span><span></span><span></span><span></span>
                </div>

                <div class="blossom b8">
                    <span></span><span></span><span></span><span></span><span></span>
                </div>

            </div>
        </div>

        <div class="sakura-tree tree-right">

            <div class="trunk"></div>

            <div class="branch one"></div>
            <div class="branch two"></div>
            <div class="branch three"></div>
            <div class="branch four"></div>
            <div class="branch five"></div>

            <div class="blossoms">

                <div class="blossom b3">
                    <span></span><span></span><span></span><span></span><span></span>
                </div>

                <div class="blossom b5">
                    <span></span><span></span><span></span><span></span><span></span>
                </div>

                <div class="blossom b6">
                    <span></span><span></span><span></span><span></span><span></span>
                </div>

                <div class="blossom b8">
                    <span></span><span></span><span></span><span></span><span></span>
                </div>

                <div class="blossom b10">
                    <span></span><span></span><span></span><span></span><span></span>
                </div>

                <div class="blossom b12">
                    <span></span><span></span><span></span><span></span><span></span>
                </div>

            </div>
        </div>

        <div class="sakura-tree tree-center">

            <div class="trunk"></div>

            <div class="branch one"></div>
            <div class="branch two"></div>
            <div class="branch three"></div>
            <div class="branch four"></div>
            <div class="branch five"></div>

            <div class="blossoms">

                <div class="blossom b2">
                    <span></span><span></span><span></span><span></span><span></span>
                </div>

                <div class="blossom b4">
                    <span></span><span></span><span></span><span></span><span></span>
                </div>

                <div class="blossom b7">
                    <span></span><span></span><span></span><span></span><span></span>
                </div>

                <div class="blossom b9">
                    <span></span><span></span><span></span><span></span><span></span>
                </div>

                <div class="blossom b11">
                    <span></span><span></span><span></span><span></span><span></span>
                </div>

            </div>
        </div>

    </div>

    <div class="ground"></div>

    <div class="petals" id="petals"></div>

    <div class="fog"></div>
    <div class="fog f2"></div>
    <div class="fog f3"></div>

    <main class="welcome">

        <div class="greeting">
            Привет, Зайчуля-красотуля.
        </div>

        <div class="question">
            Как ты сегодня? Как настроение?
        </div>

        <div class="message">
            Если сегодня был плохой день — не переживай.
            Мы сейчас всё исправим.
            Оставим всё плохое за этой дверью и попробуем вернуть тебе улыбку и настроение.
        </div>

        <button class="enter-button" id="enterButton">
            Войти сюда
        </button>

    </main>

    <div class="fade" id="fade"></div>

</div>

<script>

/* =========================
   STARS
========================= */

const stars = document.getElementById("stars");

const STAR_COUNT = 130;

for(let i = 0; i < STAR_COUNT; i++){

    const star = document.createElement("div");

    star.className = "star";

    if(Math.random() > .82){
        star.classList.add("large");
    }

    star.style.left = Math.random() * 100 + "%";
    star.style.top = Math.random() * 68 + "%";

    star.style.setProperty(
        "--duration",
        (2.5 + Math.random() * 5.5) + "s"
    );

    star.style.animationDelay =
        (-Math.random() * 6) + "s";

    stars.appendChild(star);
}


/* =========================
   FALLING PETALS
========================= */

const petals = document.getElementById("petals");

const MAX_FALLING_PETALS = 45;

function createFallingPetal(startY = -20){

    if(petals.children.length >= MAX_FALLING_PETALS){
        return;
    }

    const petal = document.createElement("div");

    petal.className = "petal";

    petal.style.left =
        (Math.random() * 110 - 5) + "%";

    petal.style.top =
        startY + "px";

    petal.style.setProperty(
        "--drift",
        ((Math.random() - .5) * 300) + "px"
    );

    petal.style.setProperty(
        "--rotation",
        ((Math.random() - .5) * 900) + "deg"
    );

    petal.style.setProperty(
        "--fall",
        (8 + Math.random() * 9) + "s"
    );

    petal.style.setProperty(
        "--opacity",
        (.38 + Math.random() * .45).toFixed(2)
    );

    petal.style.transform =
        `rotate(${Math.random() * 360}deg)`;

    petals.appendChild(petal);

    setTimeout(()=>{
        petal.remove();
    },18000);
}


/* initial petals */

for(let i = 0; i < 28; i++){

    setTimeout(()=>{
        createFallingPetal(
            -Math.random() * window.innerHeight
        );
    },i * 260);
}


/* continuous gentle snowfall */

setInterval(()=>{

    if(document.hidden) return;

    createFallingPetal(-20);

},520);


/* =========================
   SHOOTING STARS
========================= */

const shootingStar =
    document.getElementById("shootingStar");

function shootingStarEvent(){

    if(document.hidden) return;

    shootingStar.classList.remove("active");

    shootingStar.style.left =
        (72 + Math.random() * 25) + "%";

    shootingStar.style.top =
        (10 + Math.random() * 35) + "%";

    void shootingStar.offsetWidth;

    shootingStar.classList.add("active");
}


/* rare shooting stars */

function scheduleShootingStar(){

    const delay =
        9000 + Math.random() * 18000;

    setTimeout(()=>{

        shootingStarEvent();

        scheduleShootingStar();

    },delay);
}

scheduleShootingStar();


/* =========================
   NATURAL TAP EFFECT
========================= */

let tapParticleCount = 0;

const MAX_TAP_PARTICLES = 90;

function createTapPetal(x,y){

    if(tapParticleCount >= MAX_TAP_PARTICLES){
        return;
    }

    tapParticleCount++;

    const petal =
        document.createElement("div");

    petal.className = "tap-petal";

    petal.style.left = x + "px";
    petal.style.top = y + "px";

    const angle =
        Math.random() * Math.PI * 2;

    const distance =
        45 + Math.random() * 125;

    const driftX =
        Math.cos(angle) * distance;

    const driftY =
        Math.sin(angle) * distance;

    petal.style.setProperty(
        "--x",
        driftX + "px"
    );

    petal.style.setProperty(
        "--y",
        driftY + "px"
    );

    petal.style.setProperty(
        "--r",
        ((Math.random() - .5) * 900) + "deg"
    );

    petal.style.setProperty(
        "--duration",
        (3.8 + Math.random() * 2.8) + "s"
    );

    document.querySelector(".scene")
        .appendChild(petal);

    setTimeout(()=>{

        petal.remove();
        tapParticleCount--;

    },7000);
}


/* gentle interaction:
   not every tap creates the same burst */

document.addEventListener("pointerdown",(event)=>{

    if(event.target.closest(".enter-button")){
        return;
    }

    const amount =
        4 + Math.floor(Math.random() * 5);

    for(let i = 0; i < amount; i++){

        setTimeout(()=>{

            createTapPetal(
                event.clientX + (Math.random() - .5) * 18,
                event.clientY + (Math.random() - .5) * 18
            );

        },i * 55 + Math.random() * 100);
    }

});


/* =========================
   ENTER BUTTON
========================= */

const enterButton =
    document.getElementById("enterButton");

const fade =
    document.getElementById("fade");

enterButton.addEventListener("click",()=>{

    /* small final petal wave */

    const rect =
        enterButton.getBoundingClientRect();

    for(let i = 0; i < 14; i++){

        setTimeout(()=>{

            createTapPetal(
                rect.left + rect.width / 2,
                rect.top + rect.height / 2
            );

        },i * 45);
    }

    fade.classList.add("active");

    setTimeout(()=>{

        /*
          Пока оставляем здесь текущую страницу.
          Позже сюда можно поставить переход
          в настоящую 3D-сцену.
        */

        window.location.href = "index.html";

    },1500);

});


/* =========================
   VISIBILITY PERFORMANCE
========================= */

document.addEventListener(
    "visibilitychange",
    ()=>{
        if(document.hidden){
            document.querySelectorAll(".shooting-star")
                .forEach(el=>el.classList.remove("active"));
        }
    }
);

</script>

</body>
</html>
