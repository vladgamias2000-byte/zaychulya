<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Для Зайчули 🌙</title>

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      background: #050611;
      color: white;
      font-family: sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
    }

    .box {
      padding: 30px;
    }

    h1 {
      font-size: 32px;
      margin-bottom: 15px;
    }

    p {
      color: #bfc5ff;
      font-size: 18px;
    }

    button {
      margin-top: 20px;
      padding: 12px 22px;
      border: none;
      border-radius: 20px;
      background: #ffffff;
      color: #050611;
      font-size: 16px;
    }
  </style>
</head>

<body>

  <div class="box">
    <h1>🌙 Для моей Зайчули</h1>

    <p>
      Это только начало одной маленькой ночной истории.
    </p>

    <button onclick="showMessage()">Открыть</button>
  </div>

  <script>
    function showMessage() {
      alert("Я только начинаю её создавать. ❤️");
    }
  </script>

</body>
</html>
